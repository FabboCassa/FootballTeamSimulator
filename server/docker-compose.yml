# Local dev infrastructure for the FTS backend (Roadmap Phase 7).
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: fts-postgres
    environment:
      POSTGRES_DB: fts
      POSTGRES_USER: fts
      POSTGRES_PASSWORD: fts_dev_password
    ports:
      - "5432:5432"
    volumes:
      - fts-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fts"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: fts-redis
    ports:
      - "6379:6379"
    volumes:
      - fts-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      # Context is the repo root so the shared Sim.Core / Contracts projects are in scope.
      context: ..
      dockerfile: server/Api/Dockerfile
    container_name: fts-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Local dev stack → Development so the Phase 7.3 internal /internal/sim/* endpoints are
      # exposed. A real deployment does not use this compose file and defaults to Production,
      # where those endpoints stay off (verified: they 404 under Production).
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:8080"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=fts;Username=fts;Password=fts_dev_password"
      ConnectionStrings__Redis: "redis:6379"
      # Dev signing key — replace with a real secret (min 32 bytes) before any non-local deploy.
      Jwt__SigningKey: "fts_local_docker_signing_key_change_me_min_32_bytes"
      # FCM (Phase 7.4) LIVE: the service-account key is mounted read-only from ./secrets (gitignored,
      # never baked into the image). With Enabled=true + a valid key the sender initializes and pushes
      # to registered device tokens; with no devices a send returns NoDevices. Hangfire reuses Postgres.
      Fcm__Enabled: "true"
      Fcm__ProjectId: "football-team-simulator"
      Fcm__CredentialsPath: "/run/secrets/fcm.json"
    volumes:
      # Mount the Firebase service-account key at runtime (do NOT copy it into the image).
      - ./secrets/fcm.json:/run/secrets/fcm.json:ro
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fts-pgdata:
  fts-redisdata:
