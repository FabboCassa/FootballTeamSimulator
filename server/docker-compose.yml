# Local dev infrastructure for the FTS backend (Roadmap Phase 7).
# Usage: docker compose up -d
services:
  postgres:
    image: postgres:17-alpine
    container_name: fts-postgres
    environment:
      POSTGRES_DB: fts
      POSTGRES_USER: fts
      POSTGRES_PASSWORD: fts_dev_password
    ports:
      - "5432:5432"
    volumes:
      - fts-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fts"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: fts-redis
    ports:
      - "6379:6379"
    volumes:
      - fts-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  fts-pgdata:
  fts-redisdata:
