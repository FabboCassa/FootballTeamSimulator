name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-simcore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build shared libraries
        run: |
          dotnet build shared/Sim.Core/Sim.Core.csproj -c Release
          dotnet build shared/Contracts/Contracts.csproj -c Release
      - name: Run Sim.Core tests
        run: dotnet test shared/Sim.Core.Tests/Sim.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Run server tests
        run: dotnet test server/Api.Tests/Api.Tests.csproj -c Release --logger "console;verbosity=normal"
