name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Sharded by fixture: the suite is CPU-bound (~55 min of test time), one runner took ~15 min wall.
  # tools/simcore-shards.sh owns the filters; its last shard is the catch-all for unnamed fixtures.
  test-simcore:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build shared libraries
        run: |
          dotnet build shared/Sim.Core/Sim.Core.csproj -c Release
          dotnet build shared/Contracts/Contracts.csproj -c Release
      # verbosity=normal on purpose: the harness prints its measurements ([balance-*], the golden
      # master hash) through TestContext and those lines are the point of the run.
      - name: Run Sim.Core tests (shard ${{ matrix.shard }})
        # Assigned first so a bad shard number fails the step instead of an empty filter running everything.
        run: |
          filter="$(bash tools/simcore-shards.sh filter ${{ matrix.shard }})"
          dotnet test shared/Sim.Core.Tests/Sim.Core.Tests.csproj -c Release \
            --filter "$filter" \
            --logger "console;verbosity=normal" \
            --logger "trx;LogFileName=simcore-tests-${{ matrix.shard }}.trx" \
            --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simcore-test-results-${{ matrix.shard }}
          path: artifacts/test-results
          if-no-files-found: ignore

  # Proves the shard filters are disjoint and cover every test, so a shard edit can't skip one.
  simcore-shards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build Sim.Core tests
        run: dotnet build shared/Sim.Core.Tests/Sim.Core.Tests.csproj -c Release
      - name: Check shard coverage
        run: bash tools/simcore-shards.sh check

  test-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # verbosity=minimal keeps the step readable: this suite spins up the real host for every
      # fixture, and a failure has to stay visible instead of being buried (GitHub truncates a large
      # step, which hides exactly the lines you came for). Failed tests still print their message
      # and stack trace, and the full run is in the uploaded .trx either way.
      - name: Run server tests
        run: >
          dotnet test server/Api.Tests/Api.Tests.csproj -c Release
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=server-tests.trx"
          --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: artifacts/test-results
          if-no-files-found: ignore
